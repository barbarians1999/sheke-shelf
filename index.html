<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e9eef2">
  <meta name="description" content="社科书架：一份持续整理的社会科学与思想史书目。">
  <title>社科书架</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='4' fill='%232c59bf'/%3E%3Ctext x='20' y='28' text-anchor='middle' font-size='23' fill='white' font-family='sans-serif'%3E社%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=20261008-reading-size">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#shelf" aria-label="社科书架首页">
      <span class="brand-mark" aria-hidden="true">社</span>
      <span>社科书架</span>
    </a>
    <div class="tools" id="shelf-tools">
      <label class="visually-hidden" for="book-search">搜索书目</label>
      <input id="book-search" type="search" placeholder="搜索书名或作者" autocomplete="off" enterkeyhint="search">
    </div>
  </header>

  <main class="shell">
    <section id="shelf-view" aria-label="藏书列表">
      <div class="shelf-controls">
        <span class="category-label">按主题</span>
        <nav id="category-filters" class="category-filters" aria-label="按主题筛选"></nav>
      </div>
      <div id="book-list" class="book-list" aria-live="polite"></div>
      <p id="empty-state" class="empty-state" hidden>没有找到这本书。</p>
    </section>

    <section id="reader-view" class="reader" aria-label="在线阅读" hidden>
      <div class="reader-header">
        <button id="back-button" class="quiet-button" type="button">返回书架</button>
        <div class="reader-header-tools">
          <span id="reader-position" class="reader-position"></span>
          <details id="font-settings" class="font-settings">
            <summary>阅读设置</summary>
            <div class="font-menu" aria-label="阅读设置">
              <div class="font-options" role="group" aria-label="阅读字体">
                <button type="button" data-reading-font="hanyi" aria-pressed="false">汉仪书仿55w</button>
                <button type="button" data-reading-font="fangsong" aria-pressed="false">字体管家仿宋</button>
              </div>
              <div class="reading-size-control">
                <label for="reading-size">正文字号 <output id="reading-size-value" for="reading-size"></output></label>
                <input id="reading-size" type="range" min="14" max="30" step="0.1" aria-label="正文字号">
                <button id="reset-reading-size" class="reset-reading-size" type="button">恢复默认字号</button>
              </div>
            </div>
          </details>
          <button id="toggle-contents" class="contents-toggle" type="button" aria-controls="chapter-list" aria-expanded="true">收起目录</button>
        </div>
      </div>
      <div id="reader-layout" class="reader-layout">
        <aside class="contents">
          <h2>目录</h2>
          <nav id="chapter-list" aria-label="章节目录"></nav>
        </aside>
        <article class="reading-page">
          <p id="reading-book-title" class="reading-book-title"></p>
          <h2 id="chapter-title"></h2>
          <div id="chapter-content" class="chapter-content" tabindex="-1"></div>
          <div class="chapter-navigation">
            <button id="previous-chapter" class="nav-button" type="button">上一章</button>
            <button id="next-chapter" class="nav-button primary" type="button">下一章</button>
          </div>
        </article>
      </div>
    </section>
  </main>
  <footer class="site-footer">友情链接：<a href="https://barbarians1999.github.io/zuoren-shelf/" target="_blank" rel="noopener noreferrer">左人书架 GitHub Pages</a></footer>
  <script src="app.js?v=20261008-reading-size" defer></script>
</body>
</html>
